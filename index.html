<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARJX Store</title>
  <style>
    :root {
      --bg: #050d1f;
      --card: #0b1a38;
      --accent: #3985ff;
      --text: #ffffff;
      --muted: #a9bbd6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .hero {
      margin: 40px auto;
      width: min(94%, 1200px);
      padding: clamp(60px, 10vw, 100px) 20px;
      background: linear-gradient(120deg, #102957, #071329);
      border: 1px solid var(--accent);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 40px rgba(57, 133, 255, 0.15);
    }

    .hero h1 {
      font-size: clamp(36px, 8vw, 65px);
      font-weight: 800;
      letter-spacing: 2px;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      margin-top: 16px;
      font-size: clamp(16px, 2.5vw, 20px);
      color: var(--muted);
      letter-spacing: 1px;
    }

    .btn {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 36px;
      background: var(--accent);
      color: var(--text);
      border: none;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #5a9bff;
      transform: translateY(-2px);
    }

    .cart {
      width: min(94%, 1200px);
      margin: 0 auto 60px;
      padding: 60px 20px;
      background: var(--card);
      border-radius: 20px;
      text-align: center;
    }

    .cart h2 {
      font-size: clamp(24px, 4vw, 36px);
      margin-bottom: 12px;
    }

    .cart p { color: var(--muted); }
  </style>
</head>
<body>

  <section class="hero">
    <h1>VALO <span>ACCOUNT</span></h1>
    <p>BIENVENUE SUR ARJX STORE</p>
    <a class="btn" href="#cart">DÉCOUVRIR</a>
  </section>

  <section class="cart" id="cart">
    <h2>Bientôt disponible</h2>
    <p>Nos produits arrivent prochainement.</p>
  </section>

</body>
</html>
